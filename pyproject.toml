[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sub-agent-orchestrator"
version = "0.1.0"
description = "Autonomous 6-SubAgent Orchestrator with Second Brain Integration and Git Worktree Isolation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Team" }
]
keywords = [
    "multi-agent",
    "orchestrator",
    "git-worktree",
    "second-brain",
    "automation",
    "autonomous-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
sub-agent-orchestrator = "core.cli:main"

[tool.setuptools]
packages = ["core", "contracts", "agents"]

[tool.setuptools.package-data]
contracts = ["role_contracts.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

